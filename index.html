<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ee">
  <meta name="description" content="Watch the 44-second launch trailer for LarpVC, a game about venture capital where no money ever moves.">
  <title>LarpVC · Launch trailer</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      background: #f6f4ee;
      color: #14231d;
      font-family: Georgia, "Times New Roman", serif;
    }
    main { width: min(100% - 40px, 1000px); margin: clamp(20px, 5vh, 54px) auto; }
    header, figcaption { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    header { margin-bottom: 20px; }
    h1 { margin: 2px 0 0; font-size: clamp(38px, 6vw, 58px); font-weight: 500; line-height: 1; letter-spacing: -.04em; }
    .eyebrow, figcaption, .game { font: 500 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
    .eyebrow { margin: 0; color: #34604b; }
    a { color: #125c3e; text-underline-offset: .2em; }
    a:focus-visible, video:focus-visible { outline: 3px solid #278256; outline-offset: 4px; }
    .game { padding: 9px 14px; border: 1px solid #637b6e; border-radius: 4px; text-decoration: none; }
    .game:hover { background: #e7ece5; }
    figure { margin: 0; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #14231d; border-radius: 6px; }
    figcaption { flex-wrap: wrap; margin-top: 12px; color: #46584d; }
    .files { display: flex; align-items: baseline; flex-wrap: wrap; gap: 12px; }
    @media (max-width: 640px) and (orientation: portrait) {
      main { width: min(100% - 32px, 44svh); }
      header { margin-bottom: 14px; }
      video { aspect-ratio: 9 / 16; }
      figcaption { align-items: flex-start; gap: 4px 16px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Launch trailer</p>
        <h1>LarpVC</h1>
      </div>
      <a class="game" href="https://larpvc.vercel.app/">Play the game <span aria-hidden="true">↗</span></a>
    </header>
    <figure>
      <video controls playsinline preload="metadata" poster="./poster.jpg" aria-label="LarpVC launch trailer">
        <source media="(max-width: 640px) and (orientation: portrait)" src="./larpvc-launch-vertical.mp4" type="video/mp4">
        <source src="./larpvc-launch-1080p.mp4" type="video/mp4">
        <a href="./larpvc-launch-1080p.mp4">Open the landscape trailer</a>
      </video>
      <figcaption>
        <span>44 seconds · Silent</span>
        <span class="files">Open MP4 <a href="./larpvc-launch-1080p.mp4">Landscape</a> <a href="./larpvc-launch-vertical.mp4">Portrait</a></span>
      </figcaption>
    </figure>
  </main>
</body>
</html>
